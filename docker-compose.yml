networks:
  opendx-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mattermost_data:
    driver: local
  wikijs_data:
    driver: local
  # Activepieces uses PostgreSQL directly, no volume needed
  metabase_data:
    driver: local
  ollama_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # [D] Data: PostgreSQL (Shared Database for keycloak, mattermost, wikijs, activepieces, metabase, dashboard)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opendx-postgres
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"  # Security: DB accessible via internal opendx-net only
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_DB_KEYCLOAK: ${POSTGRES_DB_KEYCLOAK}
      POSTGRES_DB_WIKIJS: ${POSTGRES_DB_WIKIJS}
      POSTGRES_DB_ACTIVEPIECES: ${POSTGRES_DB_ACTIVEPIECES}
      POSTGRES_DB_METABASE: ${POSTGRES_DB_METABASE}
      POSTGRES_DB_DASHBOARD: ${POSTGRES_DB_DASHBOARD}
      POSTGRES_DB_MATTERMOST: ${POSTGRES_DB_MATTERMOST}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - opendx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ----------------------------------------------------------------------------
  # [H] Human: Mattermost (Internal Communication & Team Chat)
  # ----------------------------------------------------------------------------
  mattermost:
    image: mattermost/mattermost-team-edition:release-10.2
    container_name: opendx-mattermost
    ports:
      - "${MATTERMOST_PORT:-3100}:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: ${MM_SQLSETTINGS_DRIVERNAME}
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE}
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL}
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_GITLABSETTINGS_ENABLE: ${MM_GITLABSETTINGS_ENABLE}
      MM_GITLABSETTINGS_ID: ${MM_GITLABSETTINGS_ID}
      MM_GITLABSETTINGS_SECRET: ${MM_GITLABSETTINGS_SECRET}
      MM_GITLABSETTINGS_SCOPE: ${MM_GITLABSETTINGS_SCOPE}
      MM_GITLABSETTINGS_AUTHENDPOINT: ${MM_GITLABSETTINGS_AUTHENDPOINT}
      MM_GITLABSETTINGS_TOKENENDPOINT: ${MM_GITLABSETTINGS_TOKENENDPOINT}
      MM_GITLABSETTINGS_USERAPIENDPOINT: ${MM_GITLABSETTINGS_USERAPIENDPOINT}
      MM_GITLABSETTINGS_BUTTONTEXT: ${MM_GITLABSETTINGS_BUTTONTEXT}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
      MM_SERVICESETTINGS_ENABLEPOSTUSERNAMEOVERRIDE: "true"
      MM_SERVICESETTINGS_ENABLEPOSTICONOVERRIDE: "true"
    volumes:
      - mattermost_data:/mattermost/data
    networks:
      - opendx-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ----------------------------------------------------------------------------
  # [H] Human: Keycloak (Single Sign-On / IAM)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: opendx-keycloak
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import
    networks:
      - opendx-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'


  # ----------------------------------------------------------------------------
  # [H] Human: Wiki.js (Knowledge Management & Documentation)
  # ----------------------------------------------------------------------------
  wikijs:
    image: requarks/wiki:2
    container_name: opendx-wikijs
    ports:
      - "${WIKIJS_PORT:-3200}:3000"
    environment:
      DB_TYPE: ${WIKIJS_DB_TYPE}
      DB_HOST: ${WIKIJS_DB_HOST}
      DB_PORT: ${WIKIJS_DB_PORT}
      DB_USER: ${WIKIJS_DB_USER}
      DB_PASS: ${WIKIJS_DB_PASS}
      DB_NAME: ${WIKIJS_DB_NAME}
    volumes:
      - wikijs_data:/wiki/data
    networks:
      - opendx-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # [P] Process: Activepieces (Workflow Automation — MIT License)
  # ----------------------------------------------------------------------------
  activepieces:
    image: activepieces/activepieces:latest
    container_name: opendx-activepieces
    ports:
      - "${ACTIVEPIECES_PORT:-5678}:80"
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_SANDBOX_RUN_MODE: THREADS
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE}
      AP_POSTGRES_HOST: ${AP_POSTGRES_HOST}
      AP_POSTGRES_PORT: ${AP_POSTGRES_PORT}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_POSTGRES_USE_SSL: "false"
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_FRONTEND_URL: http://localhost:80
      AP_TELEMETRY_ENABLED: "false"
      AP_TEMPLATES_SOURCE_URL: ""
      AP_REDIS_TYPE: MEMORY
      AP_QUEUE_MODE: MEMORY
    networks:
      - opendx-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # [D] Data: Metabase (Business Intelligence Dashboard)
  # ----------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.3
    container_name: opendx-metabase
    ports:
      - "${METABASE_PORT:-3300}:3000"
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
    volumes:
      - metabase_data:/metabase-data
    networks:
      - opendx-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ----------------------------------------------------------------------------
  # [I] Intelligence: Ollama (Local LLM Instance)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: opendx-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - opendx-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # ----------------------------------------------------------------------------
  # [P] Process: Dashboard (Next.js Core Application - Integrations & Portal)
  # ----------------------------------------------------------------------------
  dashboard:
    image: node:20-alpine
    container_name: opendx-dashboard
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_ISSUER_INTERNAL: http://keycloak:8080/realms/opendx
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      METABASE_SITE_URL: ${METABASE_SITE_URL}
      METABASE_SECRET_KEY: ${METABASE_SECRET_KEY}
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      MATTERMOST_URL: http://mattermost:8065
      WIKIJS_URL: http://wikijs:3000
      ACTIVEPIECES_URL: http://activepieces:80
      ACTIVEPIECES_ONBOARDING_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/onboarding
      ACTIVEPIECES_OFFBOARDING_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/offboarding
      ACTIVEPIECES_ACTIVATION_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/activation
      N8N_URL: http://activepieces:80
      METABASE_URL: http://metabase:3000
      OLLAMA_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gpt-4o-mini}
      N8N_ONBOARDING_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/onboarding
      N8N_OFFBOARDING_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/offboarding
      N8N_ACTIVATION_WEBHOOK_URL: http://activepieces:80/api/v1/webhooks/activation
      NODE_ENV: development
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npm run dev
      "
    networks:
      - opendx-net
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
